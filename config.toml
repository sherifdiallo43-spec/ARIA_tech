# Réglages de l'école. Ce fichier n'est PAS secret (les secrets sont dans .env).
# Modifie-le pour chaque école, puis redémarre le service.

[ecole]
nom = "Groupe Scolaire Exemple"

[pointeuse]
# "simulee" : pas de boîtier, les pointages sont générés par la commande `simuler`
# "zk"      : vraie pointeuse ZKTeco sur le réseau local
mode = "simulee"
ip = "192.168.1.201"
port = 4370
timeout = 5
forcer_udp = false               # à passer à true pour certains vieux modèles
intervalle_sync_secondes = 30    # fréquence de lecture de la pointeuse
# Pour plusieurs pointeuses, ajoute des blocs [[pointeuses]] au lieu de ip/port ci-dessus :
# [[pointeuses]]
# ip = "192.168.1.201"
# nom = "Entrée principale"
# [[pointeuses]]
# ip = "192.168.1.202"
# nom = "Entrée secondaire"
anti_doublon_minutes = 30        # deux pointages du même élève à moins de 30 min = un seul
# Vidage automatique de la mémoire du boîtier, une fois tout mis en sécurité.
# Il se déclenche quand la mémoire dépasse ce nombre de pointages (0 = jamais),
# et seulement dans la plage horaire indiquée (le boîtier est bloqué quelques secondes).
# Si le PC est éteint le soir, choisis une plage où il est allumé (ex. ["12:30", "14:00"]).
vider_au_dela = 20000
vidage_auto_entre = ["18:00", "23:59"]

# Deux pointages par jour : l'arrivée le matin et la sortie à la fin des cours.
# Le premier pointage de la journée est l'arrivée, le suivant est la sortie.
[horaires]
retard_apres = "08:00"         # arrivée après cette heure = retard
sortie_seule_apres = "16:00"   # un PREMIER pointage après cette heure est une sortie
                               # (l'élève a oublié de pointer en arrivant)

# Professeurs et autres adultes qui pointent (commandes import-personnel et
# import-emploi-du-temps). Sans personnel inscrit, rien ne change pour l'école.
[personnel]
tolerance_retard_minutes = 5   # arrivée plus de 5 min après le début du cours = retard

# Le rapport du personnel (jour et mois) est confidentiel : il est envoyé par
# email au directeur seul, jamais affiché sur le tableau de bord.
[directeur]
email = ""          # adresse du directeur
# "console" : l'email s'affiche à l'écran (tests, démos)
# "smtp"    : envoi réel (identifiants SMTP_... dans .env)
mode = "console"

[abonnement]
# Qui paie ?
#   "parents" : chaque parent paie prix_mensuel (après l'essai gratuit), saisi avec `pt paiement`
#   "forfait" : l'école paie un forfait pour tous ses élèves, aucun paiement par élève
paiement = "parents"
prix_mensuel = 1000   # FCFA
essai_jours = 30      # durée de l'essai gratuit à l'inscription
part_prestataire_pourcent = 100   # part des abonnements reversée au prestataire

[rapports]
journalier_apres = "18:00"   # le rapport du jour est généré à partir de cette heure

[notifications]
# "console" : les messages s'affichent à l'écran (tests, démos)
# "meta"    : envoi réel par WhatsApp, via l'API Cloud de Meta (jeton dans .env)
mode = "console"
age_max_minutes = 120   # au-delà, un pointage récupéré en retard n'est plus notifié
max_tentatives = 10     # après 10 échecs, le message est abandonné
# Messages envoyés aux parents :
#   "arrivee", "sortie" : à chaque passage
#   "retard"            : seulement les arrivées en retard
#   "absence"           : les élèves qui n'ont pas pointé à l'heure `absence_apres`
# Formule Complet  : ["arrivee", "sortie", "absence"]
# Formule Essentiel : ["retard", "absence"]
types_notifies = ["arrivee", "sortie"]
absence_apres = "09:00"              # heure du constat d'absence (lundi au samedi)
# Sécurité : aucune alerte d'absence si moins de 50 % des élèves ont pointé
# (jour férié, grève, panne au portail...) ou si une pointeuse n'a pas répondu.
absence_min_presents_pourcent = 50
# --- WhatsApp (mode "meta") ---
langue_meta = "fr"   # langue sous laquelle les modèles ont été approuvés
# true : envoie le texte tel quel, sans modèle. Seulement pour les démos : WhatsApp ne
# le livre que si le téléphone a écrit au numéro dans les dernières 24 h.
texte_libre = false

# Noms des modèles approuvés dans WhatsApp Manager, un par type d'alerte. Chacun a
# 3 variables : {{1}} école, {{2}} élève et classe, {{3}} heure (textes : voir README).
[notifications.modeles_meta]
arrivee = "aria_arrivee"
retard = "aria_retard"
sortie = "aria_sortie"
absence = "aria_absence"

[sauvegarde]
retention_jours = 30    # les sauvegardes plus anciennes sont supprimées
# Copie quotidienne sur une clé USB (ou un disque externe) : protège contre la panne
# ou le vol du PC. Crée une fois un dossier de ce nom à la racine de la clé, puis
# laisse-la branchée. La lettre de la clé (E:, F:...) peut changer, ce n'est pas grave.
# Un chemin complet est aussi accepté ("E:/sauvegardes"). "" = pas de copie externe.
copie_externe = ""

[chemins]
base = "data/pointage.db"
pointeuse_simulee = "data/pointeuse_simulee.json"
sauvegardes = "backups"
archives = "archives"
rapports = "rapports"
logs = "logs"

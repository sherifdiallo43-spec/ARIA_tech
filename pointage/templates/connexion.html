{% extends "base.html" %}
{% block titre %}Connexion{% endblock %}
{% block contenu %}
<div class="centre carte">
  <h1>Connexion</h1>
  <p class="sous-titre">Réservé à l'administration de l'école.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <p><input type="password" name="mot_de_passe" placeholder="Mot de passe" autofocus required
              class="pleine-largeur"></p>
    <button class="bouton pleine-largeur" type="submit">Se connecter</button>
  </form>
</div>
{% endblock %}
